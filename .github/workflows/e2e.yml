name: Real-Obsidian tests

on:
    push:
        branches: ['main']
    schedule:
        - cron: '17 3 * * *'
    # Also triggered by check_for_new_obsidian.yml when Obsidian publishes a new version.
    workflow_dispatch:

permissions:
    contents: read

jobs:
    e2e:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile

            # Run the config directly (Node strips the types): with CI set it prints the resolved
            # Obsidian versions, used as the cache key. Its own download is then deleted so the
            # cache restore below does not conflict with it.
            - name: Get Obsidian cache key
              run: |
                  node e2e-tests/wdio.conf.mts | grep 'obsidian-cache-key:' > obsidian-versions-lock.txt
                  rm -rf .wdio-obsidian-cache

            - name: Cache Obsidian
              uses: actions/cache@v6
              with:
                  path: .wdio-obsidian-cache
                  key: obsidian-cache-${{ hashFiles('obsidian-versions-lock.txt') }}

            # Obsidian needs a display: Xvfb is a virtual display server and herbstluftwm a
            # window manager, without which some Obsidian features misbehave.
            - name: Setup virtual graphics
              run: |
                  sudo rm -rf /etc/apt/sources.list.d/*.list
                  echo "set man-db/auto-update false" | sudo debconf-communicate
                  sudo dpkg-reconfigure man-db

                  sudo apt-get update -q
                  sudo apt-get install -q herbstluftwm dzen2 x11-xserver-utils

                  export DISPLAY=:99
                  echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"
                  Xvfb $DISPLAY -screen 0 1280x1024x24 +extension GLX -noreset &
                  sleep 1
                  herbstluftwm &
                  sleep 1

            - name: Run real-Obsidian tests
              run: pnpm e2e
              env:
                  # GitHub runners have two cores.
                  WDIO_MAX_INSTANCES: 2
