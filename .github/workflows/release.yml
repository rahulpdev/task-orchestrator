name: Release Obsidian plugin

# Pushing a tag such as 0.2.0 (no leading "v") starts a release; no other tag does. Lint, format
# and tests run before the build, which then creates a draft release with the three files
# Obsidian installs, each attached and attested on its own.
on:
    push:
        tags: ['[0-9]+.[0-9]+.[0-9]+']

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile

            - name: Check the manifest and that the tag matches its version
              run: node scripts/check-manifest.ts --tag "${GITHUB_REF#refs/tags/}"

            - run: pnpm lint
            - run: pnpm format:check
            - run: pnpm test
            - run: pnpm build

            # One attestation per file: a single attestation covering several files failed
            # verification in a reported 2026 case.
            - name: Attest main.js
              uses: actions/attest@v4
              with:
                  subject-path: main.js
            - name: Attest manifest.json
              uses: actions/attest@v4
              with:
                  subject-path: manifest.json
            - name: Attest styles.css
              uses: actions/attest@v4
              with:
                  subject-path: styles.css

            - name: Create draft release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  gh release create "$tag" --title "$tag" --draft main.js manifest.json styles.css
