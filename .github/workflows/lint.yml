name: Node.js build

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6
            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build --if-present
            - run: pnpm run lint
